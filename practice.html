<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Backgrounds</h1>

    <h1>Image Properties</h1>
    <img src="images/Laptop1.jpg" alt="A Laptop">

    <h1>Links</h1>

    <a href="https://www.bing.com">Visit Bing</a>

    <h1>Tables</h1>
    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Country</th>
        </tr>

        <tr>
            <td>John</td>
            <td>18</td>
            <td>Nigeria</td>
        </tr>

        <tr>
            <td>Mary</td>
            <td>20</td>
            <td>Ghana</td>
        </tr>
    </table>

    <h1>Lists</h1>
    <ul>
        <li>Mango</li>
        <li>Apple</li>
        <li>Orange</li>
        <li>Banana</li>
    </ul>

    <ol>
        <li>Umbrella</li>
        <li>Shoes</li>
        <li>Fruits</li>
        <li>Snacks</li>
    </ol>

    <div class="box">
        <p>It is inside the box</p>
    </div>
</body>
</html>
